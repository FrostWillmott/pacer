[project]
name = "pacer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.2",
    "uvicorn[standard]>=0.49.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.16.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover"]

[tool.mypy]
strict = true

[dependency-groups]
dev = [
    # Pinned to match the ruff-pre-commit rev in .pre-commit-config.yaml so the
    # CI/`make check` ruff and the pre-commit ruff enforce the same rule codes.
    "ruff==0.16.10",
    "mypy>=1.16.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "aiosqlite>=0.22.1",
    "pytest-cov>=7.1.0",
]
