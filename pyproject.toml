[project]
name = "pacer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.138.2",
    "uvicorn[standard]>=0.49.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.16.0",
    "apscheduler>=4.0.0a5",
    "httpx>=0.28.0",
    "pydantic-settings>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.16.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "psycopg2-binary>=2.9.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
strict = true

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
]
